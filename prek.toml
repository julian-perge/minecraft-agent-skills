#:schema https://www.schemastore.org/prek.json
minimum_prek_version = "0.5.0"
# The validator fixtures are broken on purpose (bad JSON and YAML, CRLF, no final newline), and vendor/ holds js-yaml exactly as it ships.
exclude = '^tests/fixtures/|/vendor/'

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  # Two trailing spaces in Markdown are a line break, so the hook keeps them in .md files.
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]
